# Event-driven release manager (GitHub-only mode) — COPY ME to enable.
#
# This is a TEMPLATE, intentionally shipped under docs/examples/ so it is NOT
# active in this repo. To use it, copy it into YOUR repo at
#     .github/workflows/release-on-ready.yml
# and commit. It makes the single-writer release lane fully hands-off: workers
# add the `release:ready` label and stop; this workflow runs the one-shot
# release-manager, which merges ready + CI-green PRs serially into the base
# branch. Nothing else merges.
#
# WHY SEVERAL TRIGGERS — the release-manager only merges a PR once its CI is
# GREEN. A worker usually adds `release:ready` WHILE CI is still running, so a
# lone `labeled` trigger would observe pending checks and skip. The other
# triggers re-evaluate the queue once CI lands:
#   - pull_request (labeled)  : label added when CI was already green.
#   - workflow_run (completed): the RELIABLE "after CI" trigger when your CI is
#                               a GitHub Actions workflow — uncomment it below
#                               and set your CI workflow's name.
#   - check_suite (completed) : fires for THIRD-PARTY CI apps (CircleCI, etc.).
#                               NOTE: GitHub does NOT emit check_suite for suites
#                               created by GitHub Actions (anti-recursion), so it
#                               will NOT fire if your CI is GitHub Actions — rely
#                               on workflow_run or the cron in that case.
#   - schedule (cron)         : backstop, and the real cadence when your CI is
#                               GitHub Actions. Tighten for lower merge latency.
#   - workflow_dispatch       : manual kick.
# Each run re-evaluates the whole ready+green queue, so the triggering PR does
# not matter — any trigger drains everything currently mergeable.
#
# SERIALIZATION — the `concurrency` group ensures only ONE release-manager run
# executes at a time across all triggers. That is the single-writer guarantee
# that kills the rebase storm; it replaces the local mkdir-lock the CLI uses on
# a workstation. Run the Action OR a local `--loop`, not both — two hosts do not
# share a lock.
#
# CAVEATS —
#   * Commit this on your DEFAULT branch: schedule / check_suite / workflow_run
#     triggers are ignored on non-default branches.
#   * Merges here are made by GITHUB_TOKEN, whose pushes do NOT trigger other
#     workflows (an `on: push` deploy on the base branch will not fire). If you
#     need downstream automation on merge, swap in a PAT or GitHub App token:
#     `GH_TOKEN: ${{ secrets.RELEASE_PAT }}`.
#   * The token needs checks:read + statuses:read + actions:read (set in the
#     permissions block below) on TOP of the write scopes. The CI gate's
#     statusCheckRollup query reaches the check suite's workflow run, so a
#     missing read makes `gh pr list` fail and the lane merge nothing — silently.
#
# TRUST BOUNDARY — a PR is merged only if it BOTH carries `release:ready` AND
# has green CI. The real guard on `main` is therefore who/what can add the
# label plus your required checks. Keep at least one required check, and
# restrict label-add permission to trusted actors.

name: Release on ready

on:
  pull_request:
    types: [labeled]
  # If your CI is a GitHub Actions workflow, THIS is the reliable "after CI"
  # trigger — uncomment and set your CI workflow's name (its `name:` field):
  # workflow_run:
  #   workflows: ["CI"]
  #   types: [completed]
  check_suite:              # fires for third-party CI apps; NOT for GitHub Actions
    types: [completed]
  schedule:
    - cron: '*/5 * * * *'   # backstop, and the real cadence if CI is GitHub Actions
  workflow_dispatch:

permissions:
  contents: write          # merge into the base branch
  pull-requests: write     # read PRs, move labels
  # The CI gate reads each PR's statusCheckRollup, which the GraphQL API
  # traverses all the way down to checkSuite.workflowRun. Without ALL THREE of
  # these reads, `gh pr list --json statusCheckRollup` fails with "Resource not
  # accessible by integration" and the lane silently merges NOTHING.
  checks: read             # check runs
  statuses: read           # commit statuses
  actions: read            # the check suite's Actions workflow run

concurrency:
  group: release-manager   # ONE writer at a time
  cancel-in-progress: false

jobs:
  release:
    # For label events, act only on release:ready. Other event types always run
    # (they re-scan the full queue, so the triggering PR is irrelevant).
    if: >-
      github.event_name != 'pull_request' ||
      github.event.label.name == 'release:ready'
    runs-on: ubuntu-latest
    steps:
      - name: Check out target repository
        uses: actions/checkout@v4

      - name: Check out symphony-claude-lane (provides bin/release-manager)
        uses: actions/checkout@v4
        with:
          repository: jvogan/symphony-claude-lane
          ref: main          # pin a tag once you adopt, for reproducibility
          path: .scl

      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Ensure release labels exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for L in release:ready release:queued release:merged release:failed; do
            gh label create "$L" -R "${{ github.repository }}" 2>/dev/null || true
          done

      - name: Drain release:ready PRs (serial, CI-gated)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Personal repos: --strategy squash (serial, no repo settings needed).
          # Org repos with GitHub Merge Queue: switch to --strategy queue.
          .scl/bin/release-manager \
            --repo . \
            --github-repo "${{ github.repository }}" \
            --no-linear \
            --strategy squash \
            --apply \
            --max 20
