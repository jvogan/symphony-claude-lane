interface:
  display_name: "Symphony + Claude Lane"
  short_description: "Smart multi-model dispatch for Symphony + Linear"
  default_prompt: "Use $symphony-claude-lane to set up smart multi-model routing for this Symphony + Linear repo — analyze task characteristics to pick the right agent (Claude or Codex) for each issue, persist the routing profile, and document closeout, privacy, and model selection behavior."
dependencies:
  tools:
    - type: "mcp"
      value: "linear"
      description: "Linear MCP server for queue, state, and closeout guidance"
      transport: "streamable_http"
      url: "https://mcp.linear.app/mcp"
policy:
  allow_implicit_invocation: true
